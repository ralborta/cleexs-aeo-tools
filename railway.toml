# Config en raíz: Railway construye con Dockerfile (backend). Root Directory vacío.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Incluir railway.toml para que cambios de config disparen deploy; un push sin cambios en estos archivos puede ser "Skipped"
watchPatterns = ["Dockerfile", ".dockerignore", "railway.toml", "backend/**"]

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
